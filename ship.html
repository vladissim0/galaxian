<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxian</title>
  <link rel="stylesheet" href="ship.css">
  <script src="ship.js" defer></script>
  <script src="script.js" defer></script>
  
</head>
<body>
  <main class="game-layout">
    <section class="game">
      <h1>Space Game</h1>

      <div class="score">
        Score: <span id="score">0</span>
      </div>

      <div id="game-field" class="game-field">
        <div id="player" class="ship player"></div>
      </div>
    </section>

    <aside>
      <button id="start-button">Start Game</button>
    </aside>
  </main>
</body>
</html>
